# ==============================================================
# YVY Explorer — Cloudflare Pages + Worker proxy
# Proyecto Pages (conectar por dashboard o `wrangler pages project create`).
# Build: npm ci && npm run build · Output: dist
# Los assets pesados (pmtiles/fgb) salen de R2 vía functions/tiles/*
# y functions/data/*, NUNCA de bucket público directo (§10 spec).
# R2 binding: YVY_DATA (crear el bucket en el dashboard y enlazarlo
# al proyecto Pages con ese nombre exacto).
# ==============================================================

name = "yvy-explorer"
compatibility_date = "2025-01-01"

[env.production]
# vars de entorno de producción (si se necesitan a futuro)

[[env.production.r2_buckets]]
binding = "YVY_DATA"
bucket_name = "yvy-data"
