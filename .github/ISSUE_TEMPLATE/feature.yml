name: Feature / dataset
description: Nueva capacidad o nueva fuente de datos
labels: ["feature"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema a resolver
      description: "Quién lo necesita y para qué decisión. No la solución todavía."
    validations:
      required: true
  - type: dropdown
    id: alcance
    attributes:
      label: Alcance
      options:
        - dataset nuevo (fuente + curación)
        - ontología (tipo, métrica o relación nueva)
        - UI del dossier
        - pipeline / infraestructura
        - marca blanca / multi-tenant
    validations:
      required: true
  - type: textarea
    id: fuente
    attributes:
      label: Fuente de los datos
      description: "Nombre oficial, URL, formato, fecha de corte. Sin fuente no entra al contrato."
  - type: input
    id: yvy_id
    attributes:
      label: yvy_id (si aplica)
      description: "Entidad/es afectada o de prueba (ej. 1660063 = Salta, municipio)."
  - type: checkboxes
    id: contrato
    attributes:
      label: Confirmo que la propuesta respeta el contrato
      options:
        - label: Métricas con `unidad` y `fuente`; faltante = `null` + `estado`, nunca `0`
        - label: Relaciones con `fuente`; el tipo vive en `data/ontologia.json`, no en el `yvy_id`
