name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: build + gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # El build primero: los tests de contrato validan los agregados
      # recién generados (null + estado), no los de un checkout viejo.
      - run: pnpm run build
      - run: pnpm run test

      - name: gate-a anti-raw
        run: |
          DIFF=$(git diff --name-only origin/${{ github.base_ref || 'master' }}...HEAD 2>/dev/null || true)
          if echo "$DIFF" | grep -E '\.fgb$'; then
            echo "gate-a: .fgb prohibido en el repo"; exit 1
          fi
          if echo "$DIFF" | grep -E '\.parquet$' | grep -v '^data/registry/'; then
            echo "gate-a: .parquet solo en data/registry/"; exit 1
          fi
          if echo "$DIFF" | grep -E '\.pmtiles$' | grep -v '^public/data/'; then
            echo "gate-a: .pmtiles solo en public/data/"; exit 1
          fi
          for f in public/data/manifest.json public/data/manifest.jsonld; do
            if echo "$DIFF" | grep -qx "$f"; then
              node -e "JSON.parse(require('node:fs').readFileSync('$f','utf8'))" \
                || { echo "gate-a: $f corrupto (no parsea)"; exit 1; }
            fi
          done
          for f in $(echo "$DIFF" | grep -E '\.pmtiles$' || true); do
            sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
            if [ "$sz" -gt 52428800 ]; then
              echo "gate-a: $f supera 50MB → a R2 (cruce el umbral del repo)"; exit 1
            fi
          done
          for f in $(echo "$DIFF" | grep -E '\.parquet$' || true); do
            sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
            if [ "$sz" -gt 104857600 ]; then
              echo "gate-a: $f supera 100MB (límite duro de GitHub)"; exit 1
            fi
          done
          echo "gate-a ok (pmtiles ≤50MB; registry parquet input del build, solo límite 100MB)"

      - name: gate-b atribucion
        run: |
          grep -q "OpenFreeMap © OpenMapTiles © OpenStreetMap" src/js/main.js || { echo "gate-b: atribución obligatoria ausente"; exit 1; }
          if grep -q "arcgisonline\|Esri, Maxar" src/js/main.js; then echo "gate-b: resto satelital prohibido"; exit 1; fi
          echo "gate-b ok"

      - name: gate-c headers
        run: |
          grep -q "Content-Security-Policy" public/_headers || { echo "gate-c: falta CSP"; exit 1; }
          grep -q "Strict-Transport-Security" public/_headers || { echo "gate-c: falta HSTS"; exit 1; }
          grep -q "Permissions-Policy" public/_headers || { echo "gate-c: falta Permissions-Policy"; exit 1; }
          if grep -q "Access-Control-Allow-Origin: \*" public/_headers; then echo "gate-c: CORS * prohibido (solo yvylabs.com)"; exit 1; fi
          echo "gate-c ok"

      - name: gate-d functions
        run: |
          grep -q "onRequestGet" "functions/tiles/[[path]].js" || { echo "gate-d: tiles sin método explícito"; exit 1; }
          grep -q "onRequestGet" "functions/data/[[path]].js" || { echo "gate-d: data sin método explícito"; exit 1; }
          grep -q "KEY_RE" "functions/tiles/[[path]].js" || { echo "gate-d: tiles sin allowlist"; exit 1; }
          grep -q "MAX_BODY" functions/api/event.js || { echo "gate-d: event sin límite de body"; exit 1; }
          echo "gate-d ok"
