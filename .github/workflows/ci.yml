name: ci

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  build:
    name: build + gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: gate-a anti-raw
        run: |
          if git diff --name-only origin/${{ github.base_ref || 'master' }}...HEAD 2>/dev/null | grep -E '\.(pmtiles|parquet|fgb)$|public/data/manifest.*\.json'; then
            echo "gate-a: raw o manifests derivados en el diff — prohibido (SPEC §6)"; exit 1
          fi
          echo "gate-a ok"

      - name: gate-b atribucion
        run: |
          grep -q "Esri, Maxar, Earthstar Geographics" src/js/main.js || { echo "gate-b: atribución obligatoria ausente"; exit 1; }
          echo "gate-b ok"

      - name: gate-c headers
        run: |
          grep -q "Content-Security-Policy" public/_headers || { echo "gate-c: falta CSP"; exit 1; }
          grep -q "Strict-Transport-Security" public/_headers || { echo "gate-c: falta HSTS"; exit 1; }
          grep -q "Permissions-Policy" public/_headers || { echo "gate-c: falta Permissions-Policy"; exit 1; }
          if grep -q "Access-Control-Allow-Origin: \*" public/_headers; then echo "gate-c: CORS * prohibido (solo yvylabs.com)"; exit 1; fi
          echo "gate-c ok"

      - name: gate-d functions
        run: |
          grep -q "onRequestGet" "functions/tiles/[[path]].js" || { echo "gate-d: tiles sin método explícito"; exit 1; }
          grep -q "onRequestGet" "functions/data/[[fgb]].js" || { echo "gate-d: data sin método explícito"; exit 1; }
          grep -q "KEY_RE" "functions/tiles/[[path]].js" || { echo "gate-d: tiles sin allowlist"; exit 1; }
          grep -q "MAX_BODY" functions/api/event.js || { echo "gate-d: event sin límite de body"; exit 1; }
          echo "gate-d ok"
