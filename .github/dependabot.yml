version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Minor/patch de devDependencies agrupados: un PR por semana, no diez.
    # Los de runtime (maplibre, pmtiles) van uno a uno: se prueban a mano.
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Majors manuales (Fase 2 / track propio). Security updates sí pasan.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
