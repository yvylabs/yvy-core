<!DOCTYPE html>
<html lang="es" data-dock="oculto">
<head>
  <script>try{if(localStorage.getItem('yvy:tema')==='light')document.documentElement.setAttribute('data-theme','light');if(localStorage.getItem('yvy:swap')==='1')document.documentElement.classList.add('layout--swap')}catch(e){}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Yvy Explorer</title>
  <meta name="description" content="Grafo de entidades del territorio argentino. Dossier por jurisdicción con datos oficiales (Censo 2022, IGN): población, viviendas y superficie. En el navegador, sin login, gratis." />
  <meta name="theme-color" content="#0B0E14" />
  <link rel="manifest" href="./manifest.webmanifest" />

  <!-- Open Graph / Twitter -->
  <meta property="og:title" content="Yvy Explorer" />
  <meta property="og:description" content="Grafo de entidades del territorio argentino. Dossier por jurisdicción con datos oficiales (Censo 2022, IGN): población, viviendas y superficie. En el navegador, sin login, gratis." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://explorer.yvylabs.com" />
  <meta name="twitter:card" content="summary_large_image" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Yvy Explorer",
    "applicationCategory": "GeographicInformationSystem",
    "operatingSystem": "Web Browser",
    "description": "Grafo de entidades del territorio argentino. Dossier por jurisdicción con datos oficiales (Censo 2022, IGN): población, viviendas y superficie. En el navegador, sin login, gratis.",
    "author": {
      "@type": "Organization",
      "name": "Yvy Labs",
      "email": "yvylabs@proton.me"
    },
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>

  <link rel="icon" type="image/png" href="./assets/yvy_logo.png" />
  <link rel="stylesheet" href="./src/css/main.css" />
</head>
<body>

  <!-- ============================================================ -->
  <!-- TOPBAR -->
  <!-- ============================================================ -->
  <header class="topbar" id="topbar">
    <a href="./" class="topbar__brand" aria-label="Yvy Explorer — Volver al inicio">
      <img src="./assets/yvy_logo.png" alt="" class="topbar__logo" />
      <span class="topbar__brand-text">
        <span class="topbar__name">Yvy Explorer</span>
        <span class="topbar__tagline">Soporte a la acción</span>
      </span>
    </a>

    <nav class="topbar__crumbs" id="topbar-crumbs" aria-label="Jerarquía activa"></nav>

    <div class="topbar__right">
      <button class="topbar__tema" id="btn-tema" type="button" aria-pressed="false" aria-label="Cambiar a modo claro" data-tooltip="Modo claro / oscuro"><svg class="tema-ico tema-ico--sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4L19 19M19 5l-1.6 1.6M6.6 17.4L5 19"/></svg><svg class="tema-ico tema-ico--luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg></button>
      <a class="topbar__labs" href="https://yvylabs.com" target="_blank" rel="noopener" aria-label="Yvy Labs — versión marca blanca">Labs <span class="topbar__labs-beta">Beta</span> →</a>
      <span class="topbar__fps" id="topbar-fps" title="Cuadros por segundo" hidden></span>
    </div>
  </header>

  <!-- ============================================================ -->
  <!-- LAYOUT FLEX: dossier (55%, con el mapa incrustado arriba) +   -->
  <!-- panel Grafo (45%). El mapa es el render secundario del dossier -->
  <!-- ============================================================ -->
  <div class="layout">
    <aside class="dock" id="dock" data-vista="inicio">
      <!-- MAPA INCRUSTADO: tira superior del dossier (oculto → lleno) -->
      <main class="mapa-col mapa-col--incrustado" id="mapa-col">
        <div id="map" class="map"></div>

        <!-- TOOLBAR (vive DENTRO de la columna del mapa: se corre solo) -->
        <nav class="toolbar toolbar--left" id="toolbar-left" aria-label="Barra de navegación">
          <button class="toolbar-btn" id="btn-buscar" aria-expanded="false" aria-label="Buscar jurisdicción" data-tooltip="Buscar jurisdicción">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
          </button>

          <button class="toolbar-btn" id="btn-ficha" aria-expanded="false" aria-label="Dossier de la jurisdicción" data-tooltip="Dossier del objeto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6" stroke-linecap="round"/></svg>
          </button>

          <button class="toolbar-btn" id="btn-zoom-in" aria-label="Acercar" data-tooltip="Acercar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button class="toolbar-btn" id="btn-zoom-out" aria-label="Alejar" data-tooltip="Alejar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button class="toolbar-btn" id="btn-location" aria-label="Mi ubicación" data-tooltip="Mi ubicación">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 22c-5.523 0-10-4.477-10-10S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
          </button>
          <button class="toolbar-btn" id="btn-mapa-full" aria-expanded="false" aria-label="Expandir mapa" data-tooltip="Expandir mapa (⤢)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
        </nav>

        <button class="mapa-col__cerrar" id="btn-mapa-cerrar" aria-label="Colapsar mapa, volver al dossier" hidden>✕</button>
      </main>

      <!-- Vista BIENVENIDA / COMMAND (solo Ctrl+K o botón buscar) -->
      <section class="welcome" id="welcome" hidden aria-label="Consulta territorial">
        <div class="welcome__panel">
          <header class="welcome__head">
            <span class="welcome__eyebrow">CONSULTA TERRITORIAL</span>
            <h1 class="welcome__title">¿Qué lugar querés consultar?</h1>
          </header>

          <div class="welcome__search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
            <input type="search" id="welcome-input" class="welcome__input" placeholder="Buscar un lugar…" autocomplete="off" spellcheck="false" maxlength="80" aria-label="Buscar lugar" />
            <span class="welcome__hint" id="welcome-hint"></span>
          </div>

          <div class="welcome__results" id="welcome-results"></div>

          <footer class="welcome__foot">
            <span class="welcome__foot-label">ACCESOS</span>
            <div class="welcome__suggestions" id="welcome-suggestions"></div>
            <span class="welcome__kbd">Ctrl+K para buscar · Esc para ocultar el panel</span>
            <span class="welcome__meta" id="welcome-meta"></span>
          </footer>
        </div>
      </section>

      <!-- Vista DOSSIER (jurisdicción elegida) -->
      <section class="floating-panel" id="panel-explorador" hidden aria-label="Dossier de la jurisdicción">
        <header class="floating-panel__head" id="explorer-head-inspect">
          <div class="explorer-inspect-title">
            <span class="explorer-inspect-title__label">Dossier</span>
            <span class="explorer-inspect-title__id" id="explorer-inspect-id">—</span>
          </div>
          <button class="floating-panel__close" data-close aria-label="Cerrar, volver al inicio">✕</button>
        </header>
        <div class="floating-panel__body explorer-detalle" id="explorer-detalle">
          <div id="objeto-info"></div>
        </div>
      </section>
    </aside>

    <!-- PANEL GRAFO: la lente por defecto del territorio (R2 lo dibuja) -->
    <section class="panel-grafo" id="panel-grafo" aria-label="Grafo del territorio">
      <header class="panel-grafo__top">
        <span class="panel-grafo__label">GRAFO DEL TERRITORIO</span>
        <nav class="panel-grafo__bc" id="panel-grafo-bc" aria-label="Jerarquía del grafo"></nav>
      </header>
      <div class="panel-grafo__body" id="panel-grafo-body"></div>
    </section>

    <!-- Swap ⇄ (R5): pill circular sobre el divisor Dossier/Grafo.
         Corre con --dock-ancho (flip en CSS con .layout--swap); en <=768px
         se oculta (el grafo se cambia por tabs). Conserva id btn-swap: el
         wiring (inicializarSwap) no cambia y el FOUC del head solo toca la
         clase layout--swap, no la ubicación del botón. -->
    <button class="swap-pill" id="btn-swap" type="button" aria-pressed="false" aria-label="Intercambiar Dossier ↔ Grafo" data-tooltip="Intercambiar Dossier ↔ Grafo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13"/><path d="m14 6 3 3-3 3"/><path d="M20 15H7"/><path d="m10 12-3 3 3 3"/></svg>
    </button>

    <!-- TABS MOBILE (R4): [Dossier | Grafo] bajo la topbar -->
    <nav class="dossier-tabs" id="dossier-tabs" aria-label="Vistas móviles">
      <button type="button" data-tab="dossier" aria-pressed="true">DOSSIER</button>
      <button type="button" data-tab="grafo" aria-pressed="false">GRAFO</button>
    </nav>
  </div>

  <!-- ============================================================ -->
  <!-- BARRA DE PRODUCTO (objeto activo) -->
  <!-- ============================================================ -->
  <footer class="status-bar" id="status-bar">
    <span class="status-bar__item status-bar__item--objeto"><span class="status-bar__v" id="st-objeto">Ninguna jurisdicción seleccionada</span></span>
    <span class="status-bar__item status-bar__item--right"><span class="status-bar__k">Acceso abierto · Sin registro · ¿Marca blanca?</span>&nbsp;<a class="status-bar__link" href="mailto:yvylabs@proton.me?subject=Marca%20blanca%20Yvy%20Explorer">hablemos →</a></span>
  </footer>

  <!-- Cloudflare Web Analytics: visitantes únicos (privado, sin cookies).
       Pegar el token del dashboard; sin token no mide (no rompe nada). -->
  <!-- <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-token="REEMPLAZAR-token-de-WebAnalytics"></script> -->
  <script type="module" src="./src/js/main.js"></script></body>
</html>
